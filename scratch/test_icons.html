<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: #070c18;
      display: flex;
      gap: 20px;
      padding: 40px;
      align-items: center;
    }
    .btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      box-shadow: 0 1.5px 0 #020617, 0 3px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(36, 29, 17, 0.95);
      border: 1.5px solid #d97706;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
    }
    .amber { color: #fbbf24; font-size: 14px; }
    .crimson { color: #f43f5e; font-size: 13px; }
  </style>
</head>
<body>
  <!-- Squircle style matching reference website -->
  <div class="btn"><i class="fa-solid fa-right-left crimson"></i></div>
  <div class="btn"><i class="fa-solid fa-sun amber"></i></div>

  <!-- Circular pill style -->
  <div class="circle-btn"><i class="fa-solid fa-sun amber"></i></div>
  <div class="circle-btn"><i class="fa-solid fa-gear amber"></i></div>
</body>
</html>
