<!DOCTYPE html>
<html>
<head>
<style>
  html {
    overflow-x: clip;
  }
  body {
    margin: 0;
    padding: 0;
    min-height: 3000px;
    background: #f0f4f8;
    overflow-x: clip;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .app-wrapper {
    width: 100%;
    max-width: 1200px;
    padding: 1.5rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 3rem;
  }
  .nav-container {
    position: sticky;
    top: 1rem;
    z-index: 1000;
    background: white;
    padding: 1rem 2rem;
    border-radius: 50px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }
  .content {
    height: 800px;
    background: #e2e8f0;
    padding: 2rem;
    border-radius: 20px;
  }
</style>
</head>
<body>
  <div class="app-wrapper">
    <nav class="nav-container" id="nav">
      <b>STICKY NAVBAR</b>
    </nav>
    <div class="content">Section 1</div>
    <div class="content">Section 2</div>
    <div class="content">Section 3</div>
  </div>
  <div id="debug" style="position: fixed; bottom: 10px; right: 10px; background: black; color: white; padding: 10px; z-index: 9999;"></div>
  <script>
    window.addEventListener('load', () => {
      window.scrollTo(0, 500);
      setTimeout(() => {
        const rect = document.getElementById('nav').getBoundingClientRect();
        document.getElementById('debug').innerText = 'Nav Top: ' + rect.top + 'px, Scrolled: ' + window.scrollY;
      }, 50);
    });
  </script>
</body>
</html>
