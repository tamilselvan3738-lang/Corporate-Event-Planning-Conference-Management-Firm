<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Soft Rounded Tile for High Contrast Favicon -->
  <rect width="64" height="64" rx="14" fill="#070c18"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5"/>

  <!-- 3D Cube Isometric Facets -->
  <!-- Top Face -->
  <polygon points="32,10 52,21.5 32,33 12,21.5" fill="url(#topFace)" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
  
  <!-- Left Face -->
  <polygon points="12,21.5 32,33 32,54 12,42.5" fill="url(#leftFace)" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  
  <!-- Right Face -->
  <polygon points="32,33 52,21.5 52,42.5 32,54" fill="url(#rightFace)" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>

  <!-- Center Golden Sparkle / Star (EventSphere Brand Motif) -->
  <g filter="url(#glow)">
    <!-- 4-point star on top facet -->
    <path d="M 32,18 Q 32,22 36,22 Q 32,22 32,26 Q 32,22 28,22 Q 32,22 32,18 Z" fill="url(#starGlow)"/>
    <circle cx="32" cy="22" r="1.2" fill="#ffffff"/>
    
    <!-- Accent Sparkle on Left Facet -->
    <circle cx="22" cy="37" r="1.5" fill="#fde047" opacity="0.9"/>
    
    <!-- Accent Sparkle on Right Facet -->
    <circle cx="42" cy="37" r="1.5" fill="#93c5fd" opacity="0.9"/>
  </g>
</svg>